name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    name: Composer + style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: composer validate
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Code style (PSR-12)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis (PHPStan level 5)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: .env.example matches getenv() calls (R6.4)
        run: php bin/ci/check-env-vars.php

      - name: README.md file links exist (R6.1)
        run: php bin/ci/check-readme-paths.php

  test-no-db:
    name: Tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPUnit (--exclude-group db and redis)
        run: vendor/bin/phpunit --exclude-group db --exclude-group redis

  docker-compose-integration:
    name: Docker Compose integration
    runs-on: ubuntu-latest
    env:
      SESSION_COOKIE_SECRET: ci-docker-compose-session-cookie-secret-32
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: ./tests/docker/validate-docker-compose.sh

      - name: Validate .env.example
        run: ./tests/docker/validate-env.sh

      - name: Run Docker Compose integration verification
        run: ./tests/docker/integration-test.sh

  test-full:
    name: Tests (with MySQL) + coverage
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: ec_hub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ec_hub
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run migrations
        run: php bin/migrate.php

      - name: Seed database
        run: php bin/seed.php

      - name: PHPUnit (full suite) + coverage
        run: vendor/bin/phpunit --exclude-group redis --coverage-clover=coverage.xml --coverage-text=coverage.txt

      - name: PHPUnit (Redis infrastructure)
        run: vendor/bin/phpunit --group redis

      - name: Show coverage summary
        run: cat coverage.txt

      - name: Enforce minimum line coverage
        run: php bin/ci/check-coverage.php coverage.xml 70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
