services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ec-hub-app
    ports:
      - "9501:9501"  # php -S built-in server
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./bin:/var/www/html/bin
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./views:/var/www/html/views
      - ./tests:/var/www/html/tests
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock
      - ./phpunit.xml:/var/www/html/phpunit.xml
      - ./.php-cs-fixer.php:/var/www/html/.php-cs-fixer.php
      - composer-cache:/root/.composer/cache
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ec_hub
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ec-hub-network

  mysql:
    image: mysql:8.0
    container_name: ec-hub-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=ec_hub
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ec-hub-network

  redis:
    image: redis:7-alpine
    container_name: ec-hub-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ec-hub-network

networks:
  ec-hub-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  composer-cache:
    driver: local
